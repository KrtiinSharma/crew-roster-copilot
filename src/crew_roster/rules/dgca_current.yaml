name: dgca_current
label: "DGCA FDTL, current rules (Phase 2 in force from 1 Nov 2025)"
limits:
  max_ft_per_duty: {value: 8, unit: h, source: "CAR 7-J-III Rev 1 (8 Jan 2024) para 6.1.1 (8 h at 3-6 landings; the CAR allows 9 h at 2 landings and 10 h at 1, modelled conservatively as 8 h)"}
  max_fdp_by_landings:
    value: {1: 13, 2: 13, 3: 12.5, 4: 12, 5: 11.5, 6: 11}
    unit: h
    source: "CAR 7-J-III Rev 1 para 6.1 table (6.1.1-6.1.3), two-pilot operation; para 6.2 allows duty period up to FDP + 1 h (not modelled)"
  night_window: {value: ["00:00", "06:00"], unit: clock, source: "CAR 7-J-III Rev 1 para 3.11: night duty = any duty encroaching 0000-0600 in acclimatised zone"}
  night_max_fdp: {value: 10, unit: h, source: "CAR 7-J-III Rev 1 para 6.1.4: operations encroaching night, FDP 10:00"}
  night_max_landings: {value: 2, unit: count, source: "CAR 7-J-III Rev 1 para 6.1.4: max 2 landings in a night-encroaching duty (was 6)"}
  max_consecutive_nights: {value: 2, unit: count, source: "CAR 7-J-III Rev 1 para 13.1: no more than two consecutive nights (13.1 permits one exception per 168 h; not modelled)"}
  min_rest: {value: 12, unit: h, source: "CAR 7-J-III Rev 1 para 10.1: rest at least as long as the preceding duty or 12 h, whichever is greater"}
  weekly_rest: {value: 48, unit: h, source: "CAR 7-J-III Rev 1 para 10.6: 48 h continuous incl. two local nights, at most 168 h between rests (10.6.1: 60 h after more than 3 night-encroaching duties; not modelled)"}
  ft_7d: {value: 35, unit: h, source: "CAR 7-J-III Rev 1 para 8.1: flight time in 7 consecutive days"}
  ft_28d: {value: 100, unit: h, source: "CAR 7-J-III Rev 1 para 8.3: flight time in 28 consecutive days"}
  duty_7d: {value: 60, unit: h, source: "CAR 7-J-III Rev 1 para 8.1: cumulative duty period in 7 consecutive days"}
  duty_28d: {value: 190, unit: h, source: "CAR 7-J-III Rev 1 para 8.3: cumulative duty period in 28 consecutive days"}
