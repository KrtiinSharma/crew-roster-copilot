[project]
name = "crew-roster"
version = "0.1.0"
description = "Crew Roster Copilot: DGCA-compliant pilot rostering with CP-SAT, disruption re-planning and a LangGraph agent"
readme = "README.md"
authors = [
    { name = "Krtiin Sharma", email = "krtiinsharma2415@gmail.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: takes more than ~10 s on a slow laptop (run with -m slow)"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
crew-solve = "crew_roster.cli:main"
