[project]
name = "crew-roster"
version = "0.1.0"
description = "Crew Roster Copilot: DGCA-compliant pilot rostering with CP-SAT, disruption re-planning and a LangGraph agent"
readme = "README.md"
authors = [
    { name = "Krtiin Sharma", email = "krtiinsharma2415@gmail.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.115",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langsmith>=0.3",
    "ortools>=9.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/crew_roster/api/main.py" = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: takes more than ~10 s on a slow laptop (run with -m slow)",
    "live: calls the real Groq API; needs GROQ_API_KEY in .env (run with -m live)",
]
addopts = "-m 'not slow and not live'"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
crew-solve = "crew_roster.cli:main"
crew-serve = "crew_roster.api.main:main"
crew-eval = "crew_roster.eval.cli:main"
