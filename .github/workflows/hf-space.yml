name: Deploy backend to Hugging Face Space

# Pushes only what the Dockerfile needs to the Space, with the Space README from deploy/hf-space.
# Needs, under Settings -> Secrets and variables -> Actions:
#   secret   HF_TOKEN  a Hugging Face access token with write access
#   variable HF_SPACE  <hf-username>/<space-name>, e.g. someone/crew-roster-copilot
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "deploy/hf-space/**"
      - ".github/workflows/hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require HF_TOKEN and HF_SPACE
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the secret HF_TOKEN and the variable HF_SPACE (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - name: Build the Space tree
        run: |
          mkdir space
          cp -r Dockerfile pyproject.toml uv.lock src space/
          cp deploy/hf-space/README.md space/README.md
      - name: Push to the Space
        working-directory: space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync from GitHub ${GITHUB_SHA::7}"
          git push -q --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
