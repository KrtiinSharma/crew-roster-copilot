name: Deploy backend to Hugging Face Space

# Pushes a Gradio Space (deploy/hf-space/app.py serving the FastAPI app, src/, requirements.txt
# from pyproject.toml) to Hugging Face. Free accounts get Gradio Spaces on ZeroGPU; Docker is paid.
# Needs, under Settings -> Secrets and variables -> Actions:
#   secret   HF_TOKEN  a Hugging Face access token with write access to the Space
#   variable HF_SPACE  <hf-username>/<space-name>, e.g. someone/crew-roster-copilot
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "deploy/hf-space/**"
      - ".github/workflows/hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require HF_TOKEN and HF_SPACE
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the secret HF_TOKEN and the variable HF_SPACE (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Space folder
        run: python deploy/hf-space/make_space.py space
      - name: Push to the Space
        working-directory: space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync from GitHub ${GITHUB_SHA::7}"
          git push -q --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
